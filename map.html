<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height:100%; width:100%; margin:0; padding:0; background:#ddd; }
    .hint { position:absolute; z-index:1000; left:10px; right:10px; top:155px; background:rgba(255,255,255,.88); padding:7px 9px; border-radius:8px; font:13px sans-serif; pointer-events:none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="hint">Auf die Karte tippen, um die Testposition dorthin zu setzen.</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([50.0, 8.0], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    let marker = L.marker([50.0, 8.0]).addTo(map);

    window.setMarker = function(lat, lon, center) {
      marker.setLatLng([lat, lon]);
      if (center) map.setView([lat, lon], Math.max(map.getZoom(), 16));
    };

    map.on('click', function(e) {
      marker.setLatLng(e.latlng);
      if (window.AndroidBridge && window.AndroidBridge.teleport) {
        window.AndroidBridge.teleport(e.latlng.lat, e.latlng.lng);
      }
    });
  </script>
</body>
</html>
